# ===========================================================================
# hkex-cmdb-sync 公共配置（与环境无关，可入库、可随制品发布）
#
# 环境相关的地址与凭据放在 application-{profile}.properties 里，
# 由启动脚本的 SPRING_PROFILE 环境变量选择，默认 prod。
#
# 生效原理：conf/ 目录由 bin/hkexCmdbSync 挂到 classpath 上（排在 lib/ 之前），
#           所以这里改完重启即可生效，不需要重新打包。
# ===========================================================================

spring.application.name=hkex-cmdb-sync
server.port=18080

spring.jackson.default-property-inclusion=non_null

logging.level.com.cloudwise.cmdb=INFO

# ---------------------------------------------------------------------------
# ServiceNow（地址与凭据见 application-{profile}.properties）
# ---------------------------------------------------------------------------
servicenow.token-path=/oauth_token.do
servicenow.group-query=group.nameENDSWITH_SUP
servicenow.page-size=5000
servicenow.connect-timeout=10000
# 全量 2 万+ 记录，读超时留足
servicenow.read-timeout=120000
servicenow.token-refresh-ahead-seconds=300

# ---------------------------------------------------------------------------
# DOUC（地址与认证见 application-{profile}.properties）
# ---------------------------------------------------------------------------
douc.api-prefix=/api/v1
douc.language=zh_CN
# 留空 = 用户组平铺在顶层；填组 ID 则挂到该父组下
douc.parent-group-id=
douc.default-group-type=1
douc.user-page-size=500
douc.connect-timeout=10000
douc.read-timeout=60000

# 默认试运行，避免误写数据；确认无误后再在 profile 配置里设 false
douc.dry-run=true

# 认证方式，三选一：
#   direct —— 直连 DOUC 服务端口，不做认证（内网部署用）
#   apim   —— 应用签名（走网关时用）
#   cookie —— 浏览器会话（仅人工联调，会过期）
# 说明见 application-dev.properties / application-prod.properties
douc.auth-mode=cookie

# 与服务端 apim.sign.mode 保持一致，可选 sm3 / md5 / sha256
douc.sign-mode=sm3

# ---------------------------------------------------------------------------
# XXL-Job 定时任务
# ---------------------------------------------------------------------------
# cron 不在这里配，在 XXL-Job 管理后台新建任务时填：0 0 3 * * ?（每天 3 点）
xxl.job.executor.app.name=hkex-cmdb-sync
xxl.job.executor.port=18599
xxl.job.executor.log.path=./logs/jobhandler
xxl.job.executor.log.retention.days=7
xxl.job.executor.ip=
