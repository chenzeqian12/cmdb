cmdb.remote-config.enabled=true
cmdb.remote-config.group=hkex-cmdb-sync
cmdb.remote-config.data-id=hkex-cmdb-sync-config.json
cmdb.remote-config.timeout-ms=3000

# OMP 固定探测根路径 /health 和 /metrics，而不是 /actuator 下的端点。
management.endpoints.web.base-path=/
management.endpoints.web.path-mapping.prometheus=metrics
management.endpoints.web.exposure.include=health,prometheus
management.endpoints.web.discovery.enabled=false
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
