# ===========================================================================
# hkex-cmdb-sync 公共配置（与环境无关，可入库、可随制品发布）
#
# ServiceNow 与 DOUC 业务配置经 DOUC 加密后保存于 Nacos，本文件只保留非敏感运行参数。
#
# 生效原理：conf/ 目录由 bin/hkexCmdbSync 挂到 classpath 上（排在 lib/ 之前），
#           所以这里改完重启即可生效，不需要重新打包。
# ===========================================================================

spring.application.name=hkex-cmdb-sync
server.port=18080

spring.jackson.default-property-inclusion=non_null

logging.level.com.cloudwise.cmdb=INFO

# ---------------------------------------------------------------------------
# Nacos 密文位置。Nacos 连接参数由部署平台提供为 -DcwNacos*，不写入本文件。
# ---------------------------------------------------------------------------
cmdb.remote-config.enabled=true
cmdb.remote-config.group=hkex-cmdb-sync
cmdb.remote-config.data-id=hkex-cmdb-sync-config.json
cmdb.remote-config.timeout-ms=3000

# ---------------------------------------------------------------------------
# XXL-Job 定时任务
# ---------------------------------------------------------------------------
# cron 不在这里配，在 XXL-Job 管理后台新建任务时填：0 0 3 * * ?（每天 3 点）
xxl.job.executor.app.name=hkex-cmdb-sync
xxl.job.executor.port=18599
xxl.job.executor.log.path=./logs/jobhandler
xxl.job.executor.log.retention.days=7
xxl.job.executor.ip=

# 本形态（docc 形态，由 bin/hkexCmdbSync 启动）走 XXL-Job 调度，
# 关掉 Spring 进程内的那个定时器，避免同一份同步被跑两遍。
# 插件形态（packaging/，OmniAgent 安装）没有 XXL-Job，那套配置里默认是开的。
hkex.sync.scheduled-enabled=false
